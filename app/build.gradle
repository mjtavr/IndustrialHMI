
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.industrialhmi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.industrialhmi'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '2.0.20'
            details.because 'Keep Kotlin stdlib compatible with Kotlin compiler 2.0.20'
        }
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
}
